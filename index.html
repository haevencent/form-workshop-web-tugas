<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop</title>
  <!-- Panggil Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 540px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-4">Pendaftaran Workshop Web</h1>

        <form id="formDaftar" novalidate>
          <div class="mb-3">
            <label for="nama" class="form-label">Nama lengkap</label>
            <!-- Tambah required (wajib diisi) dan minlength="3" (minimal 3 huruf) -->
            <input id="nama" type="text" class="form-control" placeholder="Contoh: Andi Pratama" required minlength="3">
            <div id="nama-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <!-- Tambah required supaya "kosong" bisa dideteksi lewat valueMissing -->
            <input id="email" type="email" class="form-control" placeholder="nama@domain.com" required>
            <div id="email-hint" class="form-text">Contoh: nama@domain.com</div>
            <div id="email-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="hp" class="form-label">Nomor WhatsApp</label>
            <!--
              Tambah:
              - required            -> kalau kosong, valueMissing = true
              - pattern="08[0-9]{8,11}" -> harus diawali 08, lalu 8 sampai 11 angka lagi
                                           (total 10-13 digit). Kalau tidak cocok, patternMismatch = true
            -->
            <input id="hp" type="text" inputmode="numeric" class="form-control" placeholder="081234567890" required pattern="08[0-9]{8,11}">
            <div id="hp-hint" class="form-text">Diawali 08, 10-13 digit</div>
            <div id="hp-error" class="invalid-feedback"></div>
          </div>

          <!-- field Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <!-- required = wajib diisi, minlength="8" = minimal 8 karakter (kalau kurang, tooShort = true) -->
            <input id="password" type="password" class="form-control" placeholder="Minimal 8 karakter" required minlength="8">
            <div id="password-hint" class="form-text">Minimal 8 karakter</div>
            <div id="password-error" class="invalid-feedback"></div>
          </div>

          <!-- field Re-type Password -->
          <div class="mb-3">
            <label for="password2" class="form-label">Re-type Password</label>
            <!-- Kecocokan dengan password dicek di script.js, karena HTML tidak bisa membandingkan dua field -->
            <input id="password2" type="password" class="form-control" placeholder="Ulangi password" required>
            <div id="password2-error" class="invalid-feedback"></div>
          </div>

          <div class="mb-4">
            <!-- "Tanggal kehadiran" diganti menjadi "Tanggal lahir" (id juga diganti jadi "lahir") -->
            <label for="lahir" class="form-label">Tanggal lahir</label>
            <!--
              max="2006-10-22" -> tanggal paling akhir yang boleh dipilih.
              Hari ini 22 Oktober 2026, dikurangi 20 tahun = 22 Oktober 2006.
              Kalau memilih tanggal setelah itu, berarti umur < 20 tahun, dan rangeOverflow = true.
            -->
            <input id="lahir" type="date" class="form-control" required max="2006-10-22">
            <div id="lahir-hint" class="form-text">Usia minimal 20 tahun</div>
            <div id="lahir-error" class="invalid-feedback"></div>
          </div>

          <button id="tombolKirim" type="submit" class="btn btn-primary w-100">Daftar</button>
          <div id="statusForm"></div>
        </form>
      </div>
    </div>
  </main>
<script src="script.js"></script>
</body>
</html>
